[project]
name = "stock-news-bot"
version = "1.0.0"
description = "실시간 주식 뉴스 수집/분류/알림 디스코드 봇"
requires-python = ">=3.12,<3.13"
dependencies = [
    "discord.py>=2.7.1",
    "aiohttp>=3.13.0",
    "feedparser>=6.0.11",
    "python-dotenv>=1.0.1",
    "tenacity>=8.2.3",
    "requests>=2.31.0",
    "pykrx>=1.2.8",
    "googlenewsdecoder>=0.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
