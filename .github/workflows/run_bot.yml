name: News Bot Auto Run

on:
  schedule:
    - cron: '*/1 * * * *'  # 1분마다 실행
  workflow_dispatch:      # 수동 실행 버튼 활성화

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 깃허브 코드 가져오기
      uses: actions/checkout@v4

    - name: 파이썬 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 필요한 라이브러리 설치
      run: |
        pip install feedparser requests

    - name: 봇 실행
      env:
        DART_API_KEY: ${{ secrets.DART_API_KEY }}
      run: |
        python news_bot.py
